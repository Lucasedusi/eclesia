<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0B3D32" />
    <title>Sem conexão — Eclesias Financeiro</title>
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; padding: 24px; display: grid; place-items: center; background: #f6faf7; color: #18352c; font: 16px system-ui, sans-serif; }
      main { width: min(100%, 420px); padding: 32px 24px; border: 1px solid #dce7df; border-radius: 20px; background: white; text-align: center; }
      .mark { display: grid; place-items: center; width: 64px; height: 64px; margin: 0 auto 22px; border-radius: 18px; background: #0b3d32; color: #e9f8eb; font-size: 34px; }
      h1 { margin: 0 0 12px; font-size: 24px; }
      p { line-height: 1.6; color: #52695e; }
      a { display: block; margin-top: 24px; padding: 14px 18px; border-radius: 10px; background: #087f5b; color: white; font-weight: 600; text-decoration: none; }
      a:focus-visible { outline: 3px solid #a9e45b; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">↗</div>
      <h1>Sem conexão</h1>
      <p>O Financeiro precisa de internet para consultar e registrar informações. Confira sua conexão e tente novamente.</p>
      <a href="/financeiro">Tentar novamente</a>
    </main>
  </body>
</html>
